# Keeps the Archivio Supabase project (free tier) from pausing.
# Supabase pauses free projects after 7 days without activity, so this pings
# twice a week (Mon + Thu, 06:00 UTC) to leave a safety margin.
# For strictly once a week, change the cron to: "0 6 * * 1"

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"; cat response.txt; echo
          if [ "$status" -ge 300 ]; then
            echo "::error::Keep-alive ping failed (HTTP $status)"
            exit 1
          fi
